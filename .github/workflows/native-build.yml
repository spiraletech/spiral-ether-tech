name: Hakui Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dependency-free targets
        run: >-
          cmake -S . -B build
          -DHAKUI_BUILD_NATIVE_CLIENT=OFF
          -DHAKUI_ENABLE_IMVU_CAL3D=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  native-windows:
    name: Native client (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native client
        run: >-
          cmake -S . -B build
          -DHAKUI_BUILD_NATIVE_CLIENT=ON
          -DHAKUI_ENABLE_IMVU_CAL3D=OFF
          -DBUILD_TESTING=OFF

      - name: Build native client
        run: cmake --build build --config Release --target hakui --parallel 2
