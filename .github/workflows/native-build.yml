name: Hakui Native Build

# Manual only while the Spiral/AUM architecture is being laid down.
# Do not auto-build on push/PR during engine-logic construction.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAKUI_ENABLE_IMVU_CAL3D=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2
