name: Hakui Native Build

# Manual only while the Spiral/AUM architecture is being laid down.
# Do not auto-build on push/PR during engine-logic construction.
on:
  workflow_dispatch:

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dependency-free Spiral Core
        run: >-
          cmake -S . -B build
          -DHAKUI_BUILD_NATIVE_CLIENT=OFF
          -DHAKUI_ENABLE_IMVU_CAL3D=OFF
          -DHAKUI_ENABLE_SPIRAL_LOGIC_SPECS=ON

      - name: Build Spiral logic spec only
        run: >-
          cmake --build build
          --config Release
          --target spiral_logic_spec
          --parallel 2

      - name: Run Spiral logic spec
        run: ./build/Release/spiral_logic_spec.exe
