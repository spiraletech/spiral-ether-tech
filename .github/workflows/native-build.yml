name: Hakui Build and Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hakui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.867 chat UI source fix
        run: python tools/apply_chat_ui_v0867.py

      - name: Apply v0.868 IMVU social stack
        run: python tools/apply_imvu_social_v0868.py

      - name: Apply v1.01 skate embodiment pass
        run: python tools/apply_skate_embodiment_v101.py

      - name: Apply Mannequin Lab isolation patch
        run: python tools/apply_mannequin_lab_v01.py

      - name: Configure dependency-free targets
        run: >-
          cmake -S . -B build
          -DHAKUI_BUILD_NATIVE_CLIENT=OFF
          -DHAKUI_ENABLE_IMVU_CAL3D=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  native-windows:
    name: Native clients (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.867 chat UI source fix
        run: python tools/apply_chat_ui_v0867.py

      - name: Apply v0.868 IMVU social stack
        run: python tools/apply_imvu_social_v0868.py

      - name: Apply v1.01 skate embodiment pass
        run: python tools/apply_skate_embodiment_v101.py

      - name: Apply Mannequin Lab isolation patch
        run: python tools/apply_mannequin_lab_v01.py

      - name: Configure native clients
        run: >-
          cmake -S . -B build
          -DHAKUI_BUILD_NATIVE_CLIENT=ON
          -DHAKUI_ENABLE_IMVU_CAL3D=OFF
          -DBUILD_TESTING=OFF

      - name: Build HAKUI v1.01
        run: cmake --build build --config Release --target hakui --parallel 2

      - name: Build Mannequin Lab
        run: cmake --build build --config Release --target hakui_mannequin_lab --parallel 2

      - name: Build HAKUI Windows startup pack
        shell: pwsh
        run: >-
          ./packaging/windows/package.ps1
          -BuildDirectory ./build
          -OutputDirectory ./dist

      - name: Build Mannequin Lab Windows pack
        shell: pwsh
        run: >-
          ./packaging/windows/package_mannequin_lab.ps1
          -BuildDirectory ./build
          -OutputDirectory ./dist

      - name: Upload HAKUI Windows startup pack
        uses: actions/upload-artifact@v4
        with:
          name: spiral-os-hakui-engine-windows-x64
          path: dist/spiral-os-hakui-engine-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Mannequin Lab Windows pack
        uses: actions/upload-artifact@v4
        with:
          name: hakui-mannequin-lab-v0.1-windows-x64
          path: dist/hakui-mannequin-lab-v0.1-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = "./dist/spiral-os-hakui-engine-windows-x64.zip"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $archive `
              --verify-tag `
              --title "SPIRAL OS: HAKUI ENGINE $env:GITHUB_REF_NAME" `
              --notes "Windows startup pack. Extract the ZIP and run SPIRAL-OS-HAKUI-ENGINE.exe."
          }
