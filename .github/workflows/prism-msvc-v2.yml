name: PRISM MSVC Build v2

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble PRISM C++ source
        shell: pwsh
        run: |
          $parts = @(
            "prism_build/parts/00.b64",
            "prism_build/parts/01.b64",
            "prism_build/parts/02.b64",
            "prism_build/parts/03a.b64",
            "prism_build/parts/03b.b64",
            "prism_build/parts/03c.b64",
            "prism_build/parts/03d.b64",
            "prism_build/parts/04.b64"
          )
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          $gzPath = "prism_build/prism.cpp.gz"
          $cppPath = "prism_build/prism.cpp"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($b64))
          $input = [IO.File]::OpenRead($gzPath)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($cppPath)
          $gzip.CopyTo($output)
          $output.Dispose()
          $gzip.Dispose()
          $input.Dispose()
          if ((Get-Item $cppPath).Length -ne 59699) { throw "Source size mismatch" }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile native C++ executable
        shell: cmd
        run: >
          cl /nologo /O2 /W3 /EHsc /std:c++17 /MT
          prism_build\prism.cpp
          /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA
          user32.lib gdi32.lib ole32.lib winmm.lib kernel32.lib
          /OUT:PRISM_LAB_20K.exe

      - name: Inspect and hash
        shell: pwsh
        run: |
          Get-Item .\PRISM_LAB_20K.exe | Format-List Name,Length,LastWriteTime
          Get-FileHash .\PRISM_LAB_20K.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: PRISM_LAB_20K_MSVC
          path: PRISM_LAB_20K.exe
          if-no-files-found: error
